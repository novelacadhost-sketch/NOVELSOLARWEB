<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Payment Complete | NovelSolar</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background-color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .container {
        padding: 2rem;
        max-width: 400px;
      }
      h1 {
        color: #0f172a;
        margin: 0 0 16px;
        font-size: 24px;
        font-weight: 900;
      }
      p {
        color: #64748b;
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <!--
      Mobile-app bridge. /api/payments/paystack/callback sends app orders here
      after verifying the payment with Paystack, as
      /payment-complete.html?payment=<status>&ref=ORD-...

      `payment` is the server's verified verdict, so it is read as-is but never
      defaulted to "success": Paystack's own redirect carries no status, and a
      page that assumed success would report every abandoned or failed payment
      as paid. Anything missing or unrecognised is "unknown".

      The app still must not treat this as proof of payment — anyone can open
      this URL. It is the signal to close the WebView and re-read public.orders.
    -->
    <div class="container">
      <h1 id="title">Returning to the app…</h1>
      <p id="detail"></p>
    </div>

    <script>
      {
        const STATUSES = ['success', 'failed', 'pending', 'review']
        const COPY = {
          success: ['Payment received', 'Your order is confirmed.'],
          failed: ['Payment not completed', 'Your order is saved. You can try paying again in the app.'],
          pending: ['Confirming your payment', 'If money left your account, it will be matched shortly.'],
          review: ['Payment needs review', 'The amount did not match your order. Our team will contact you.'],
          unknown: ['Order received', 'Return to the app to check your order.'],
        }

        const params = new URLSearchParams(location.search)
        const raw = params.get('payment') || ''
        const status = STATUSES.includes(raw) ? raw : 'unknown'
        const reference = params.get('ref') || ''

        document.getElementById('title').textContent = COPY[status][0]
        document.getElementById('detail').textContent = COPY[status][1]

        try {
          if (window.CheckoutBridge && typeof window.CheckoutBridge.postMessage === 'function') {
            window.CheckoutBridge.postMessage(JSON.stringify({ status, reference }))
          }
        } catch {
          // Outside the app's WebView there is no channel; the text above stands.
        }
      }
    </script>
  </body>
</html>
