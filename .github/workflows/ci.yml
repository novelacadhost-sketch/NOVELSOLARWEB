name: CI — Typecheck

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel in-flight runs for the same PR / branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Env vars needed for nuxi prepare + typecheck (Nuxt modules
    # read these at init time; dummy values prevent crashes).
    env:
      NUXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
      NUXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy'
      SUPABASE_SERVICE_ROLE_KEY: 'dummy-service-role-key'
      BITRIX_WEBHOOK_URL: 'https://dummy.bitrix24.com/rest/1/dummy/'
      OTP_SECRET: 'ci-otp-secret-long-enough-for-hmac-validation'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Explicitly regenerate .nuxt types to ensure clean state
      - name: Generate Nuxt types
        run: npx nuxi prepare

      # vue-tsc and typescript are pinned devDependencies. Until 2026-10-12 they
      # were not installed at all: `nuxi typecheck` printed "A type checker is
      # required", found 0 errors, and this gate passed every run while checking
      # nothing. The guards below fail the job if that ever happens again.
      - name: Run typecheck (baseline-gated)
        run: |
          set +e
          npx nuxi typecheck 2>&1 | tee typecheck.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if grep -q 'type checker is required' typecheck.log; then
            echo "::error ::No type checker ran. Is vue-tsc in devDependencies?"
            exit 1
          fi

          ERROR_COUNT=$(grep -c 'error TS' typecheck.log || true)
          # Measured 2026-10-13 with vue-tsc 3.3.11 / typescript 6.0.3, locally
          # and with CI's dummy env (243). Lower it whenever the count drops.
          BASELINE=243

          # vue-tsc exits non-zero whenever there are errors, which there are.
          # Non-zero with nothing counted means the tool itself fell over.
          if [ "$EXIT_CODE" -ne 0 ] && [ "$ERROR_COUNT" -eq 0 ]; then
            echo "::error ::Typecheck exited ${EXIT_CODE} without reporting any errors: the checker crashed."
            exit 1
          fi

          echo "::notice ::Typecheck errors: ${ERROR_COUNT} (baseline: ${BASELINE})"

          if [ "$ERROR_COUNT" -gt "$BASELINE" ]; then
            echo "::error ::Typecheck regression: ${ERROR_COUNT} errors (baseline ${BASELINE}). Fix the new errors before merging."
            exit 1
          fi

          if [ "$ERROR_COUNT" -lt "$BASELINE" ]; then
            echo "::notice ::Typecheck improved: ${ERROR_COUNT} errors (was ${BASELINE}). Lower the baseline in ci.yml."
          fi

      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          retention-days: 7
